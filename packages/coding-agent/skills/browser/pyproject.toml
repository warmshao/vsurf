[project]
name = "vsurf-skill-browser"
version = "0.1.0"
description = "Browser control skill for VSurf (shared browser via the host CDP bridge)."
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "vsurf-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser"]
